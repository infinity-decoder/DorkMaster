name: Build and Release Linux Package

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Debian Package & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parse Version & Release Metadata
        id: vars
        run: |
          if echo "${{ github.ref }}" | grep -q "^refs/tags/"; then
            RAW_TAG="${{ github.ref_name }}"
            VER="${RAW_TAG#v}"
          else
            VER=$(python3 -c "import dorkmaster; print(dorkmaster.__version__)" 2>/dev/null || echo "0.0.1")
          fi
          if [ -z "$VER" ]; then
            VER="0.0.1"
          fi
          TAG_NAME="v${VER}"
          RELEASE_NAME="DorkMaster_v${VER}"
          echo "VER=${VER}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          python3 -m pip install --upgrade pip build wheel setuptools

      - name: Build Debian Package
        run: |
          mkdir -p release_assets
          PKG_BUILD="build_deb/dorkmaster"
          rm -rf "$PKG_BUILD"
          mkdir -p "$PKG_BUILD/DEBIAN"
          mkdir -p "$PKG_BUILD/usr/bin"
          mkdir -p "$PKG_BUILD/usr/lib/python3/dist-packages/dorkmaster"
          mkdir -p "$PKG_BUILD/usr/share/applications"
          mkdir -p "$PKG_BUILD/usr/share/icons/hicolor/128x128/apps"
          mkdir -p "$PKG_BUILD/usr/share/doc/dorkmaster"

          cp -r dorkmaster/* "$PKG_BUILD/usr/lib/python3/dist-packages/dorkmaster/"

          printf '#!/usr/bin/env python3\nimport sys\nfrom dorkmaster.cli import main\n\nif __name__ == "__main__":\n    sys.exit(main())\n' > "$PKG_BUILD/usr/bin/dorkmaster"
          chmod 755 "$PKG_BUILD/usr/bin/dorkmaster"

          cp dorkmaster.desktop "$PKG_BUILD/usr/share/applications/"
          cp assets/dorkmaster.png "$PKG_BUILD/usr/share/icons/hicolor/128x128/apps/"
          cp LICENSE "$PKG_BUILD/usr/share/doc/dorkmaster/copyright"

          printf "Package: dorkmaster\nVersion: %s\nSection: net\nPriority: optional\nArchitecture: all\nMaintainer: Owlopia & infinitydecoder <contact@owlopia.dev>\nDepends: python3, python3-requests, python3-bs4, python3-colorama, python3-tabulate, python3-pil, python3-tqdm, python3-pyfiglet\nDescription: Automated Google Dorking and OSINT Reconnaissance Tool\n DorkMaster is an automated Google Dorking and OSINT reconnaissance tool.\n" "${{ env.VER }}" > "$PKG_BUILD/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$PKG_BUILD" "release_assets/${{ env.RELEASE_NAME }}_all.deb"
          rm -rf build_deb

      - name: Build Python Wheel & Source Distribution
        run: |
          python3 -m build --sdist --wheel --outdir release_assets/

      - name: Generate Release Notes
        run: |
          echo "## Release: ${{ env.RELEASE_NAME }}" > release_notes.md
          echo "- **Version:** ${{ env.VER }}" >> release_notes.md
          echo "- **Tag:** ${{ env.TAG_NAME }}" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Generated Assets" >> release_notes.md
          for file in release_assets/*; do
            if [ -f "$file" ]; then
              fname=$(basename "$file")
              echo "- $fname" >> release_notes.md
            fi
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          body_path: release_notes.md
          files: release_assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
